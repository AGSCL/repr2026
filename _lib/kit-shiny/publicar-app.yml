# ⚠️ Atención
# La sintaxis es la misma idea que en los YAML usados
# en los encabezados de R Markdown y Quarto:
# - la indentación importa
# - cada nivel "cuelga" del anterior
name: Publicar app en GitHub Pages
# Eventos que activan el workflow
on:
  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:
  # También se ejecuta automáticamente al hacer push
  push:
    # Solo cuando los cambios llegan a la rama main
    branches: ["main"]
# Lo que efectivamente hará
jobs:
  # Nombre del trabajo (puede ser cualquier identificador)
  shinylive:
    # Reutiliza un workflow oficial mantenido por Posit
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    with:
      # Carpeta donde está la aplicación Shiny
      app-dir: app
      # Versión de shinylive a utilizar
      shinylive-version: shinylive
    # Permisos necesarios para publicar en GitHub Pages
    permissions:
      # Permite escribir en GitHub Pages
      pages: write
      # Permite autenticarse mediante tokens OIDC
      id-token: write
